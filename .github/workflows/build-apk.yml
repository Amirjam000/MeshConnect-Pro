name: Build MeshConnect Pro APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Make Gradlew Executable
      run: |
        sed -i 's/\r$//' ./gradlew
        chmod +x ./gradlew

    - name: Build APK with Gradle Wrapper
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MeshConnect-Pro-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: v2.0.0
        name: "MeshConnect Pro v2.0.0 APK"
        body: "دانلود مستقیم نسخه جدید MeshConnect Pro با رابط کاربری انیمیشن‌دار، انتقال مستقیم فوق سریع و چت عمومی خودکار"
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
